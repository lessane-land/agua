name: Datos semanales

# MITECO publishes the bulletin on Tuesdays and refreshes the history file
# around it. Two runs a week catch late updates; a run with no new data commits nothing.
on:
  schedule:
    - cron: "17 17 * * 2"
    - cron: "17 7 * * 4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install mdbtools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mdbtools
      - name: Build data/agua.json
        run: python3 tools/build_data.py
      - name: Commit if the data changed
        run: |
          if git diff --quiet -- data/agua.json; then
            echo "No new data."
            exit 0
          fi
          git config user.name "agua-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/agua.json
          git commit -m "Datos: boletin del $(python3 -c "import json;print(json.load(open('data/agua.json'))['date'])")"
          git push
